# unbind default prefix and set it to ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# allow nested tmux sessions
bind-key b send-prefix
set -g history-limit 500000
# NOTE: must be a literal, NOT "${TERM}". When this file is reloaded from
# inside tmux, ${TERM} is already "tmux-256color"/"screen-256color", so a
# nested tmux would inherit a bogus TERM and lose colours/keys.
set -g default-terminal "tmux-256color"
set-option -g focus-events on
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -ga terminal-overrides ",xterm*:Tc"
set -g allow-passthrough on
set-option -ga update-environment 'GPG_AGENT_INFO DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY DBUS_SESSION_BUS_ADDRESS TERM TERM_PROGRAM'
# start with 1
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
# NOTE: default-terminal is set once near the top. Do NOT re-set it from
# ${TERM} here: on reload ${TERM} is already "tmux-256color", so a nested
# tmux inherits a bogus TERM and loses colours / function keys.
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
# set window and pane index to 1 (0 by default)
# set-option -g base-index 1
setw -g pane-base-index 1

set -g visual-activity off
set -g visual-bell off
set -g visual-silence on

# ESC must be fast for vim
set -s escape-time 0

# Use vim keybindings in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ---------------------------------------------------------------------------
# Nested tmux handling
# ---------------------------------------------------------------------------
# Two independent tmux servers know nothing about each other, so the OUTER
# status bar cannot directly see an inner session. What it CAN see is the
# command running in the focused pane: the moment you attach to a nested tmux,
# that pane's foreground command is `tmux`, which is what the indicator keys on.
#
# Implemented purely as a status-left format expression - no hooks, no polling,
# no helper script - so it re-evaluates on every status refresh.
#
# NOTE: we deliberately do NOT use tmux-suspend / key-table switching here.
# `suspend.sh` sets `prefix none` and switches to the `suspended` key-table,
# which disables the outer prefix entirely - that is what made the outer bar
# show no indication and left the outer session unreachable.
set -g @nested_marker "󰒍 NESTED "

# Recompute on every status refresh (status-interval, see below).
set -g status-interval 5
set -g status-left-length 40
set -g status-left \
  "#{?#{m:*tmux*,#{pane_current_command}},#[fg=#f9e2af,bold]#{@nested_marker}#[default],}[#{session_name}] "

# F2 jumps to the nested session. `switch-client -l` moves the client to the
# last-used session - which is the inner one once you attached to it in a pane.
# If there is no nested session, say so instead of doing nothing silently.
bind -n F2 if-shell -F '#{m:*tmux*,#{pane_current_command}}' \
  'switch-client -l' \
  'display-message "F2: no nested tmux session in this pane"'

# fix ctrl-backspace
bind-key -n C-Bspace send-keys C-h

# bind -n S-down new-window
bind -n S-left prev
bind -n S-right next
# bind -n C-left swap-window -t -1
# bind -n C-right swap-window -t +1

# Make resizing panes easier
bind-key < resize-pane -L 5
bind-key > resize-pane -R 5
# bind-key Up resize-pane -U 5
# bind-key Down resize-pane -D 5
# bind-key = select-layout even-vertical
# bind-key | select-layout even-horizontal
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key = set-window-option synchronize-panes

# don't suspend-client
unbind-key C-z

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# easier pasting
bind p paste-buffer

bind l refresh-client

# use directory of pane where split from
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Local config
if-shell "[ -f ~/.config/tmux.conf.local ]" 'source ~/.config/tmux.conf.local'

# Popup stuff
bind-key t popup zsh
bind-key g popup gitui
bind-key H popup htop
bind-key B popup btop
bind-key j run-shell 'popuptmux single'
bind-key M-j run-shell 'popuptmux master'

