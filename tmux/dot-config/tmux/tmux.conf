set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator ":"
# set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_number_position "left"
# NOTE: this catppuccin version reads @catppuccin_window_text /
# @catppuccin_window_current_text and defaults BOTH to " #T" (pane TITLE).
# The older names (@catppuccin_window_default_text, *_current_text, *_fill)
# are silently IGNORED by this version - which is why every window rendered the
# shell's title payload instead of its window name. The zsh precmd hook sets a
# screen-style title and tmux keeps the literal backslash in the cwd, so #T
# showed the garbled "heiko@:\~" for every non-current window.
#
# Fix: set the CURRENT option names to #W (window NAME).
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

# Legacy option names - inert with this catppuccin version, kept for older ones.
set -g @catppuccin_window_default_fill "all"
set -g @catppuccin_window_current_fill "all"
